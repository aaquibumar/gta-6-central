name: Bootstrap GTA 6 Central site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack the site files into the repository root
        run: |
          tar -xzf bootstrap-source.tar.gz -C /tmp
          cp -a /tmp/gta-6-central/. .
          rm -rf /tmp/gta-6-central
          rm -f bootstrap-source.tar.gz .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes found."
          else
            git commit -m "feat: publish GTA 6 Central website"
            git push origin HEAD:main
          fi
