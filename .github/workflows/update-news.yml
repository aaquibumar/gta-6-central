name: Refresh GTA VI news feed

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch and filter GTA VI coverage
        run: python scripts/update-news.py
      - name: Commit feed when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+aaquibumar@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "News feed unchanged."
          else
            git commit -m "chore: refresh GTA VI news feed"
            git push
          fi
